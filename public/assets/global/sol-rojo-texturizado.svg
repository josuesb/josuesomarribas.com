<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sun" cx="42%" cy="34%" r="68%">
      <stop offset="0" stop-color="#ff4937"/>
      <stop offset="0.72" stop-color="#f63324"/>
      <stop offset="1" stop-color="#df291d"/>
    </radialGradient>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="table" tableValues="0 0.15"/>
      </feComponentTransfer>
      <feComposite in="grain" in2="SourceAlpha" operator="in" result="clippedGrain"/>
      <feBlend in="SourceGraphic" in2="clippedGrain" mode="soft-light"/>
    </filter>
  </defs>
  <circle cx="512" cy="512" r="448" fill="url(#sun)" filter="url(#paper)"/>
</svg>
