<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="4" seed="27" stitchTiles="stitch" result="fine"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="3" seed="9" stitchTiles="stitch" result="broad"/>
      <feBlend in="fine" in2="broad" mode="multiply" result="grain"/>
      <feColorMatrix in="grain" values="0 0 0 0 0.82 0 0 0 0 0.77 0 0 0 0 0.66 0 0 0 .16 0"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#f8f1e2"/>
  <rect width="512" height="512" filter="url(#paper)" opacity=".36"/>
</svg>
